<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache"><title>Grid Conquest</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--table:#5a3f28;--table2:#3e2a19;--parch:#ecdcb5;--parch2:#dcc392;--ink:#3a2a18;--muted:#6e5838;--line:#9c7f52;--cell:rgba(255,248,225,.35);
--ok:#2f6b2a;--bad:#9e1f1f;--sel:#c8901c;--lock:rgba(158,31,31,.18);
--p0:#27467f;--p1:#8e2323;--p2:#2f5f2c;--p3:#5b2d77;--display:"Cinzel",Georgia,serif;--body:"IM Fell English",Georgia,serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--table:#24180e;--table2:#140d07;--parch:#d6c395;--parch2:#bea472;--cell:rgba(255,248,225,.22)}}
:root[data-theme="dark"]{--table:#24180e;--table2:#140d07;--parch:#d6c395;--parch2:#bea472;--cell:rgba(255,248,225,.22)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:radial-gradient(ellipse at 50% 0%,var(--table),var(--table2));background-attachment:fixed;color:var(--ink);font:16px/1.35 var(--body);padding:12px 16px calc(96px + env(safe-area-inset-bottom));min-height:100vh}
.app{max-width:480px;margin:0 auto;position:relative}
.top{display:flex;align-items:center;gap:6px;position:relative}.top h1{flex:1;min-width:0}
.menu,.logbtn{flex:0 0 auto;min-height:32px;padding:2px 12px;font-size:12px}
h1{font:800 18px var(--display);letter-spacing:.06em;color:var(--parch);margin:4px 0 12px;text-align:center;text-shadow:0 1px 2px #000}
h1 .muted{color:var(--parch2);font:italic 13px var(--body);letter-spacing:0;display:block}
.sheet{background:radial-gradient(ellipse at 30% 20%,rgba(255,255,255,.35),transparent 60%),radial-gradient(ellipse at 80% 90%,rgba(120,80,30,.25),transparent 55%),var(--parch);border:1px solid var(--line);border-radius:6px;box-shadow:0 4px 14px rgba(0,0,0,.45),inset 0 0 30px rgba(120,80,30,.35)}
button{font:600 15px var(--display);letter-spacing:.03em;min-height:44px;padding:8px 12px;border:1px solid var(--line);background:var(--parch);color:var(--ink);border-radius:6px;cursor:pointer;touch-action:manipulation;box-shadow:inset 0 0 10px rgba(120,80,30,.3)}
button:disabled{opacity:.4;cursor:default}
button.on{border-color:var(--sel);box-shadow:0 0 0 2px var(--sel),inset 0 0 10px rgba(120,80,30,.3)}
button.primary{background:var(--p1);color:var(--parch);border-color:#5a1414}
select{font:16px var(--body);min-height:44px;padding:6px 8px;background:var(--parch);color:var(--ink);border:1px solid var(--line);border-radius:6px}
.card{padding:14px;margin-bottom:12px}
.chips{display:flex;gap:6px;margin-bottom:10px}
.chip{flex:1;min-width:0;padding:6px 8px;font:600 13px var(--display);display:flex;justify-content:space-between;align-items:center;gap:4px;white-space:nowrap;overflow:hidden;border-left:6px solid var(--c)}
.chip.cur{box-shadow:0 0 0 2px var(--sel),0 4px 14px rgba(0,0,0,.45)}
.chip span{font-weight:800;font-size:15px}
.objs{display:flex;gap:6px;margin-bottom:10px;align-items:stretch}
.obj{flex:1;padding:6px 4px;text-align:center;font:600 11px var(--display);cursor:pointer}
.obj.on{box-shadow:0 0 0 2px var(--sel),0 4px 14px rgba(0,0,0,.45)}
.deck{flex:0 0 54px;display:flex;flex-direction:column;justify-content:center;align-items:center;font:11px var(--display);color:var(--parch2);border:1px dashed var(--parch2);border-radius:6px}
.deck b{font-size:17px;color:var(--parch)}
.mini{display:grid;grid-template-columns:repeat(3,12px);gap:2px;justify-content:center;margin-bottom:3px}
.mini i{width:12px;height:12px;border:1px solid rgba(58,42,24,.35);border-radius:2px}
.mini i.x{background:var(--ink);border-radius:50%}
.msg{font:italic 17px var(--body);color:var(--parch);min-height:44px;margin-bottom:8px;display:flex;align-items:center;justify-content:center;text-align:center;text-shadow:0 1px 2px #000}
.mapwrap{padding:10px;position:relative}
#board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:repeat(5,minmax(0,1fr));gap:0;width:100%;aspect-ratio:1;border:2px solid var(--ink);outline:1px solid var(--ink);outline-offset:3px}
.cell{aspect-ratio:1;min-width:0;min-height:0;overflow:hidden;border:1px dashed rgba(58,42,24,.45);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;user-select:none;touch-action:manipulation}
.cell.lock{background:repeating-linear-gradient(45deg,var(--lock) 0 6px,transparent 6px 12px)}
.cell.hint::before{content:"";position:absolute;inset:18%;border:2px dashed var(--ok);border-radius:50%}
.cell.sel .tok{box-shadow:0 0 0 4px var(--sel),0 2px 4px rgba(0,0,0,.5)}
.cell.last .tok{outline:2px dotted var(--ink);outline-offset:3px}
.tok{width:76%;height:auto;aspect-ratio:1;flex:0 0 auto;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.35),transparent 50%),var(--c);display:flex;align-items:center;justify-content:center;color:var(--parch);font:800 clamp(12px,3.8vw,17px) var(--display);box-shadow:inset 0 -3px 0 rgba(0,0,0,.3),0 2px 4px rgba(0,0,0,.5);position:relative;z-index:1}
.tok.basic::after{content:"";width:22%;height:22%;border-radius:50%;background:var(--parch);opacity:.8}
.tok.special{border:2px solid var(--parch2);outline:2px solid var(--c)}
.cell.hint .tok{box-shadow:0 0 0 3px var(--ok),0 2px 4px rgba(0,0,0,.5)}
.cell .prot{position:absolute;top:1px;right:3px;font-size:12px;z-index:2}
.info{min-height:44px;font-size:14px;color:var(--parch2);margin:10px 0}
.info b{color:var(--parch);font-family:var(--display)}
.tray{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 2px;min-height:60px;line-height:1.1}
.tile .ab{font-weight:800;font-size:16px}
.tile .nm{font:11px var(--body);color:var(--muted)}
.tile .ct{font-size:12px}
.bar{position:fixed;z-index:10;left:0;right:0;bottom:0;background:linear-gradient(var(--table),var(--table2));border-top:2px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.bar .in{max-width:480px;margin:0 auto;display:flex;gap:8px}
.bar button{flex:1}
details{font-size:14px;color:var(--parch2)}
details summary{font-family:var(--display);cursor:pointer}
#log{padding-left:18px;margin:6px 0 0;max-height:200px;overflow:auto}
.muted{color:var(--muted);font-size:14px}
.row{display:flex;gap:8px;align-items:center;margin:8px 0}
.row label{flex:0 0 32px;font:800 15px var(--display)}
.row select{flex:1}
.over{border:2px solid var(--sel)}
@media (min-width:900px){body{padding-bottom:16px}.bar{position:static;background:none;border:0;padding:0;margin-top:10px}}
/* In-game: one screen, no scrolling. Column of fixed rows; the map takes the space left and stays square. */
body.playing{height:100vh;height:100dvh;min-height:0;overflow:hidden;padding:max(6px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) 0 max(10px,env(safe-area-inset-left));display:flex;flex-direction:column}
body.playing .app{flex:1;min-height:0;width:100%;display:flex;flex-direction:column}
body.playing h1{font-size:15px;margin:0;text-align:left}
body.playing .top{margin-bottom:8px}
body.playing h1 .muted{display:none}
body.playing #game{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
body.playing .chips,body.playing .objs,body.playing .msg,body.playing .info{margin:0}
body.playing .chip{padding:4px 6px}
body.playing .obj{padding:4px 2px;font-size:10px}
body.playing .mini{grid-template-columns:repeat(3,9px)}body.playing .mini i{width:9px;height:9px}
body.playing .msg{min-height:0;font-size:15px;line-height:1.2;height:2.4em}
.boardbox{flex:1;min-height:120px;container-type:size;display:flex;align-items:center;justify-content:center}
body.playing .mapwrap{width:min(100cqw,100cqh);padding:6px}
body.playing .info{font-size:13px;line-height:1.25;height:2.5em;min-height:0;overflow:hidden;text-align:center}
body.playing .tile{min-height:50px;padding:3px 2px}
.tile .nm{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile:disabled{opacity:1;background:transparent;box-shadow:none;border-style:dashed;border-color:rgba(220,195,146,.35);color:var(--parch2)}
.tile:disabled .ab{color:var(--parch2)!important;opacity:.55}.tile:disabled .nm{color:var(--parch2);opacity:.55}.tile:disabled .ct{opacity:.55}
body.playing .bar{border-top:0;background:none;position:static;flex:0 0 auto;margin:0 calc(-1*max(10px,env(safe-area-inset-right))) 0 calc(-1*max(10px,env(safe-area-inset-left)));padding:6px max(10px,env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}
body.playing .bar button{min-height:42px}
.logpanel{position:absolute;z-index:20;top:36px;left:0;right:0;max-height:60%;overflow:auto;padding:10px 12px 10px 28px;font-size:14px}
.logpanel ol{margin:0;padding:0}
[hidden]{display:none!important}
.shade{position:fixed;inset:0;z-index:30;background:rgba(20,12,6,.6);display:flex;align-items:center;justify-content:center;padding:24px}
.abcard{width:100%;max-width:340px;padding:16px;display:flex;flex-direction:column;gap:12px}
.abcard h2{margin:0;font:800 13px var(--display);letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.abrow{display:flex;gap:12px;align-items:flex-start}
.abrow .tok{width:44px;flex:0 0 44px;font-size:15px}
.abrow b{display:block;font:800 16px var(--display)}
.abrow p{margin:2px 0 0;font-size:15px;line-height:1.35}
.abcard button{width:100%}
.tile{position:relative}
.tile .i{position:absolute;top:2px;right:3px;width:16px;height:16px;border-radius:50%;background:var(--ink);color:var(--parch);font:italic 700 11px/16px Georgia,serif;text-align:center}
.tile.off{background:transparent;box-shadow:none;border-style:dashed;border-color:rgba(220,195,146,.35);color:var(--parch2)}
.tile.off .ab,.tile.off .nm,.tile.off .ct{color:var(--parch2)!important;opacity:.55}
.tile.off .i{background:var(--parch2)}
.chip{cursor:pointer}.chip .q{font:italic 700 11px Georgia,serif;opacity:.7;margin-left:4px}
</style>
</head>
<body>
<div class="app">
<div class="top"><h1>Grid Conquest <span class="muted">prototype · rules v0.3 · build 11-17b</span></h1>
<button id="logBtn" class="logbtn" hidden>Log</button>
<button id="menuBtn" class="menu" hidden>☰ Menu</button></div>
<div id="logPanel" class="logpanel sheet" hidden><ol id="log"></ol></div>
<div id="cardShade" class="shade" hidden><div id="card" class="abcard sheet" role="dialog" aria-modal="true"></div></div>
<div id="setup" class="card sheet"></div>
<div id="game" hidden>
  <div class="chips" id="chips"></div>
  <div class="objs" id="objs"></div>
  <div class="msg" id="msg"></div>
  <div class="boardbox"><div class="sheet mapwrap"><div id="board"></div></div></div>
  <div class="info" id="info"></div>
  <div class="tray" id="tray"></div>
</div>
</div>
<div class="bar" id="bar" hidden><div class="in" id="actions"></div></div>

<script>
"use strict";
// ---- Tunables (rules v0.3) ----
const CONFIG = {
  size: 5,
  basics: 8,
  specialCopies: 2,
  winTarget: {2: 5, 3: 4, 4: 3},
  displaySize: 3,
  shapeCopies: 3,
  hiddenCards: 5,
  // Test switches for simulations only; the real rules have both on.
  rules: {castleLock: true, knightProtect: true},
};
const SHAPES = [
  {name: "Line",      cells: [[0,0],[0,1],[0,2]]},
  {name: "Corner",    cells: [[0,0],[0,1],[1,0]]},
  {name: "Step",      cells: [[0,0],[0,1],[1,2]]},
  {name: "Reach",     cells: [[0,0],[0,1],[2,0]]},
  {name: "Far reach", cells: [[0,0],[0,1],[2,2]]},
  {name: "Vee",       cells: [[0,0],[0,2],[1,1]]},
  {name: "Diagonal",  cells: [[0,0],[1,1],[2,2]]},
  {name: "Corners",   cells: [[0,0],[0,2],[2,0]]},
  {name: "Crown",     cells: [[0,0],[0,2],[2,1]]},
  {name: "Scatter",   cells: [[0,0],[1,2],[2,1]]},
];
const RACES = {
  Humans: {Castle: {abbr: "Ca", text: "Can't be moved or destroyed by enemies. Until your next turn, enemies can't place tiles next to it, and tiles next to it can't be used in enemy scores."},
           Knight: {abbr: "Kn", text: "You may move one of your tiles next to this tile. It can land on an enemy basic to destroy it (not a protected one). The moved tile is protected until your next turn."},
           Quartermaster: {abbr: "QM", text: "Place a basic next to one of your other basics. It can land on an enemy basic to destroy it (not a protected one)."}},
  Elves:  {Ranger: {abbr: "Ra", text: "Destroy an enemy tile (not a protected one)."},
           Scout:  {abbr: "Sc", text: "Choose one: move up to two of your tiles to any empty spaces, or place a basic on an empty corner."},
           Elder:  {abbr: "El", text: "Return one of your basics to your supply. If you do, take another turn: you can play specials, but not another Elder. On your next turn after that, you can't play specials."}},
  Undead: {Lich:   {abbr: "Li", text: "When you score with this tile, you may use one enemy basic in the shape. It goes back to its owner."},
           "Grave keeper": {abbr: "GK", text: "Place a basic next to this tile."},
           Crypt:  {abbr: "Cr", text: "When this tile returns to your supply, place a basic where it was."}},
};
const ABBR = {}; const TEXT = {};
for (const r in RACES) for (const k in RACES[r]) { ABBR[k] = RACES[r][k].abbr; TEXT[k] = RACES[r][k].text; }

// ---- Shape matching ----
const N = CONFIG.size;
const rc = i => [Math.floor(i / N), i % N];
const idx = (r, c) => r * N + c;
function canon(coords) {
  let best = null;
  const tf = [([r,c])=>[r,c],([r,c])=>[c,-r],([r,c])=>[-r,-c],([r,c])=>[-c,r],([r,c])=>[r,-c],([r,c])=>[-c,-r],([r,c])=>[-r,c],([r,c])=>[c,r]];
  for (const f of tf) {
    const p = coords.map(f);
    const mr = Math.min(...p.map(x=>x[0])), mc = Math.min(...p.map(x=>x[1]));
    const s = p.map(([r,c])=>[r-mr,c-mc]).sort((a,b)=>a[0]-b[0]||a[1]-b[1]).join(";");
    if (best === null || s < best) best = s;
  }
  return best;
}
const SHAPE_CANON = SHAPES.map(s => canon(s.cells));
function fits3x3(coords) {
  const rs = coords.map(x=>x[0]), cs = coords.map(x=>x[1]);
  return Math.max(...rs)-Math.min(...rs) <= 2 && Math.max(...cs)-Math.min(...cs) <= 2;
}
// Lookup table: every 3-cell set on the board -> shape id (or -1). Built once.
const triKey = (a, b, c) => { if (a > b) [a, b] = [b, a]; if (b > c) [b, c] = [c, b]; if (a > b) [a, b] = [b, a]; return (a * N * N + b) * N * N + c; };
const TRI = new Int8Array(N ** 6).fill(-1);
for (let a = 0; a < N*N; a++) for (let b = a+1; b < N*N; b++) for (let c = b+1; c < N*N; c++) {
  const co = [a, b, c].map(rc);
  if (fits3x3(co)) TRI[triKey(a, b, c)] = SHAPE_CANON.indexOf(canon(co));
}
const shapeOf = cells => TRI[triKey(cells[0], cells[1], cells[2])];
function matches(cells, shapeId) { return shapeOf(cells) === shapeId; }
(function selfTest() {
  const seen = new Set();
  const all = [...Array(9).keys()].map(i=>[Math.floor(i/3), i%3]);
  for (let a=0;a<9;a++) for (let b=a+1;b<9;b++) for (let c=b+1;c<9;c++) seen.add(canon([all[a],all[b],all[c]]));
  const ok = seen.size === 10 && SHAPE_CANON.every(s=>seen.has(s)) && new Set(SHAPE_CANON).size === 10;
  console.log(ok ? "Shape self-test passed: 10 shapes cover all 3-in-3x3 arrangements" : "Shape self-test FAILED");
})();

// ---- Helpers ----
const ADJ = [];
function adj(i) { return ADJ[i]; }
for (let i = 0; i < N*N; i++) ADJ[i] = adjCalc(i);
function adjCalc(i) {
  const [r,c] = rc(i), out = [];
  for (let dr=-1; dr<=1; dr++) for (let dc=-1; dc<=1; dc++) {
    if (!dr && !dc) continue;
    const R=r+dr, C=c+dc;
    if (R>=0 && R<N && C>=0 && C<N) out.push(idx(R,C));
  }
  return out;
}
const shuffle = a => { for (let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const isBasic = k => k === "basic";

// ---- State ----
let S;
function newGame(races, bots = [], sim = false) {
  const deck = [];
  SHAPES.forEach((_, id) => { for (let i=0;i<CONFIG.shapeCopies;i++) deck.push(id); });
  shuffle(deck);
  deck.splice(0, CONFIG.hiddenCards);
  S = {
    players: races.map((race, i) => {
      const supply = {basic: CONFIG.basics};
      for (const k in RACES[race]) supply[k] = CONFIG.specialCopies;
      return {race, supply, score: 0, color: `var(--p${i})`, name: `P${i+1} ${race}${bots[i] ? ` (${bots[i]} bot)` : ""}`, bot: bots[i] || null,
        w: (bots[i] === "planner" || bots[i] === "advanced") && TRAINED[race] ? TRAINED[race] : null};
    }),
    sim, turns: 0,
    board: Array(N*N).fill(null),
    deck, display: [],
    cur: 0, turnNo: 0, extra: false, noElder: false,
    locks: [], mode: "play", chosen: null, objSel: null, scoreSel: [],
    pending: null, over: null, log: [],
  };
  while (S.display.length < CONFIG.displaySize && S.deck.length) S.display.push(S.deck.pop());
  log(`Game start: ${S.players.map(p=>p.name).join(", ")}. Target ${target()}.`);
  startTurn();
}
const P = () => S.players[S.cur];
const target = () => CONFIG.winTarget[S.players.length];
function log(t) { S.log.unshift(t); }
function lockedFor(cell, p) {
  return S.locks.some(l => l.owner !== p && adj(l.cell).includes(cell));
}
const canPut = (cell, p) => !S.board[cell] && !lockedFor(cell, p);
const ownTiles = p => S.board.map((t,i)=>t&&t.owner===p?i:-1).filter(i=>i>=0);
function specialAllowed(k) {
  if (isBasic(k)) return true;
  if (S.cur === 0 && S.turnNo === 0) return false;   // first player, first turn
  if (k === "Elder" && S.noElder) return false;
  if (P().lastSpecial) return false;   // no specials two turns in a row
  return true;
}
function playSpots(p, k) {
  const out = [];
  for (let i=0;i<N*N;i++) {
    if (canPut(i, p)) out.push(i);
    else if (!isBasic(k) && S.board[i] && S.board[i].owner===p && isBasic(S.board[i].kind) && !lockedFor(i, p)) out.push(i);
  }
  return out;
}
function canPlay(p) {
  const sup = S.players[p].supply;
  return Object.keys(sup).some(k => sup[k] > 0 && specialAllowed(k) && playSpots(p, k).length);
}
function scoringTriples(p, shapeId) {
  const own = ownTiles(p).filter(i => !lockedFor(i, p));
  const res = [];
  const tri = (arr, f) => { for (let a=0;a<arr.length;a++) for (let b=a+1;b<arr.length;b++) for (let c=b+1;c<arr.length;c++) if (f([arr[a],arr[b],arr[c]])) return true; return false; };
  if (tri(own, t => matches(t, shapeId))) return true;
  const liches = own.filter(i => S.board[i].kind === "Lich");
  if (!liches.length) return false;
  const enemyBasics = S.board.map((t,i)=>t&&t.owner!==p&&isBasic(t.kind)&&!lockedFor(i, p)?i:-1).filter(i=>i>=0);
  for (const L of liches) for (const e of enemyBasics) for (const o of own) {
    if (o === L) continue;
    if (matches([L, e, o], shapeId)) return true;
  }
  return false;
}
const canScore = p => S.display.some(id => scoringTriples(p, id));
function validClaim(p, cells, shapeId) {
  if (cells.some(i => lockedFor(i, p))) return "A tile in a Castle-locked space cannot be scored.";
  const enemy = cells.filter(i => S.board[i].owner !== p);
  if (enemy.length > 1) return "Only one enemy tile allowed (with a Lich).";
  if (enemy.length === 1) {
    if (!isBasic(S.board[enemy[0]].kind)) return "Enemy tile must be a basic tile.";
    if (!cells.some(i => S.board[i].owner === p && S.board[i].kind === "Lich")) return "Using an enemy tile needs your Lich in the pattern.";
  }
  return matches(cells, shapeId) ? null : `Those tiles do not form ${SHAPES[shapeId].name}.`;
}

// ---- Board changes ----
function returnToSupply(cell) {
  const t = S.board[cell];
  S.board[cell] = null;
  const pl = S.players[t.owner];
  pl.supply[t.kind]++;
  if (t.kind === "Crypt" && pl.supply.basic > 0 && !lockedFor(cell, t.owner)) {
    pl.supply.basic--;

// ---- Turn flow ----
function startTurn() {

  const result = top.length > 1 ? "Draw between " + top.map(r=>S.players[r.i].name).join(" and ") : `${S.players[top[0].i].name} wins`;
  S.winner = top.length > 1 ? -1 : top[0].i;
  S.endReason = reason;
  S.over = `${reason} ${result}. ` + ranked.map(r=>`${S.players[r.i].name}: ${r.score} obj, ${r.spec} specials in supply`).join(" · ");

  render();
}

function doPlay(cell) {

      if (!dests.length || !movers.length) return finish();

        prompt: "Knight: pick an allied tile to move (or Skip)."}; return render();
    }
    case "Quartermaster": {
      if (!pl.supply.basic) return finish();

    }
    case "Ranger": {

    }
    case "Scout":

        prompt: "Scout: pick an allied tile to move (up to 2), or an empty corner space for a basic tile. Or Skip."};
      if (!pendingTargets().length) { S.pending = null; return finish(); }

    }
    case "Grave keeper": {

}
const knightDests = (src, p) => adj(src).filter(i => !S.board[i] || (S.board[i].owner !== p && isBasic(S.board[i].kind) && !S.board[i].prot));

      if (S.board[cell]) { log(`${pl.name}: Knight destroys ${S.players[S.board[cell].owner].name}'s basic tile.`); returnToSupply(cell); }
      S.board[cell] = S.board[pd.from]; S.board[pd.from] = null; S.board[cell].prot = CONFIG.rules.knightProtect;

    case "qm": if (S.board[cell]) { log(`${pl.name}: Quartermaster destroys ${S.players[S.board[cell].owner].name}'s basic tile.`); returnToSupply(cell); }

    case "ranger": {

    }

      if (pd.from === null) { pd.from = cell; pd.skippable = false; pd.prompt = "Scout: pick any empty space."; return render(); }

    const t = [cand[a],cand[b],cand[c]], sh = shapeOf(t);

  let v = W.score * (P_of(p).score - Math.max(...opps.map(o => S.players[o].score)))
    + W.myScorable * scorable(p) - W.oppScorable * Math.max(...opps.map(scorable))
    + W.tile * own.length + W.pair * pairs + W.special * spec
    + (S.cur === p && !S.pending ? W.extraTurn : 0) + Math.random() * 0.5;
  if (W.myThreat || W.oppThreat) v += W.myThreat * threatCells(p) - W.oppThreat * Math.max(...opps.map(threatCells));

}
const P_of = i => S.players[i];
// Lightweight copy for search: game fields only, no log or UI state.
function cloneState(s) {
  const pd = s.pending;
  return {players: s.players.map(p => ({race: p.race, supply: {...p.supply}, score: p.score, lastSpecial: p.lastSpecial, name: p.name, bot: p.bot, w: p.w, color: p.color})),
    sim: true, turns: s.turns, board: s.board.map(t => t && {...t}), deck: s.deck.slice(), display: s.display.slice(),
    cur: s.cur, turnNo: s.turnNo, playedSpecial: s.playedSpecial, extra: s.extra, noElder: s.noElder, locks: s.locks.map(l => ({...l})),
    mode: "play", chosen: null, objSel: null, scoreSel: [],
    pending: pd && {...pd, moved: pd.moved ? new Set(pd.moved) : undefined}, over: s.over, winner: s.winner, log: []};
}
function bestAction(depth, smart = false) {
  const p = S.cur, acts = legalActions();
  let best = null, bestV = -Infinity;
  const snap = S;
  for (const a of acts) {
    S = cloneState(snap);
    applyAction(a);
    if (depth > 0 && S.pending && S.cur === p && !S.over) { const b = bestAction(depth - 1, smart); if (b) applyAction(b); }
    const v = evaluate(p, smart);
    S = snap;
    if (v > bestV) { bestV = v; best = a; }
  }
  return best;
}
// Advanced AI (all races): Information-Set Monte Carlo search, the method card
// and board game bots use when part of the game is hidden. For each promising
// move it samples futures: the unseen deck is reshuffled every time (no
// peeking), both sides play on with the quick greedy policy for a few turns,
// then the position is scored. A UCB bandit spends more samples on moves that
// look best. It stops at a sample budget, or at a time limit in the live game.
const PLAN = {shortlist: 8, samples: 48, turnsAhead: 4, explore: 0.6, timeMs: 1500};
// Per-race evaluation weights from training (train.js). Races without an entry
// use BOT + SMART defaults.
const TRAINED = {
  Humans: {myScorable: 120, oppScorable: 99, tile: 5, pair: 1, special: 3, extraTurn: 468, myThreat: 23, oppThreat: 42},
  Elves: {myScorable: 103, oppScorable: 158, tile: 2, pair: 1, special: 0, extraTurn: 137, myThreat: 10, oppThreat: 34},
  Undead: {myScorable: 145, oppScorable: 201, tile: 3, pair: 1, special: 4, extraTurn: 61, myThreat: 14, oppThreat: 39},
};
function finishOwnChoices(p) {
  let g = 0;
  while (!S.over && S.pending && S.cur === p && g++ < 6) { const b = bestAction(0); if (!b) break; applyAction(b); }
}
function bestActionPlanner(budget = PLAN) {
  const p = S.cur, snap = S, smart = !TRAINED[P().race];
  const cand = legalActions().map(a => {
    S = cloneState(snap); applyAction(a); finishOwnChoices(p);
    const v = evaluate(p, smart); S = snap;
    return {a, v, n: 0, sum: 0};
  }).sort((x, y) => y.v - x.v);
  if (!cand.length) return null;
  if (cand[0].v >= 1e6 || cand.length === 1) return cand[0].a;
  const arms = cand.slice(0, budget.shortlist);
  const t0 = Date.now(), live = !snap.sim;
  for (let it = 0; it < budget.samples * arms.length; it++) {
    if (live && Date.now() - t0 > budget.timeMs) break;
    const total = arms.reduce((t, x) => t + x.n, 0) + 1;
    const arm = arms.find(x => !x.n) || arms.reduce((m, x) => {
      const u = x.sum / x.n + budget.explore * Math.sqrt(Math.log(total) / x.n);
      return u > m.u ? {x, u} : m;
    }, {u: -Infinity}).x;
    S = cloneState(snap); shuffle(S.deck);
    applyAction(arm.a); finishOwnChoices(p);
    const stop = S.turns + budget.turnsAhead;
    while (!S.over && S.turns < stop) { const b = bestAction(BOT.lookahead); if (!b) break; applyAction(b); }
    const v = evaluate(p, smart);
    arm.sum += Math.max(-3, Math.min(3, v / BOT.score)); arm.n++;
    S = snap;
  }
  return arms.reduce((m, x) => x.n && x.sum / x.n > m.v ? {a: x.a, v: x.sum / x.n} : m, {a: arms[0].a, v: -Infinity}).a;
}
const chooseAction = () => P().bot === "advanced" || P().bot === "planner" ? bestActionPlanner() : bestAction(BOT.lookahead);
function botStep() {
  if (S.over || !P().bot) return;
  const a = chooseAction();
  if (a) applyAction(a);
}
let botTimer = null;
function scheduleBot() {
  clearTimeout(botTimer);
  if (!S.over && P().bot) botTimer = setTimeout(botStep, 500);
}
function simulate(raceA, raceB, games, turnCap = 400, aiA = "basic", aiB = "basic", wA = null) {
  const r = {games, winsA: 0, winsB: 0, draws: 0, firstWins: 0, turns: 0, reasons: {}};
  for (let g = 0; g < games; g++) {
    const aFirst = g % 2 === 0;
    newGame(aFirst ? [raceA, raceB] : [raceB, raceA], aFirst ? [aiA, aiB] : [aiB, aiA], true);
    if (wA) S.players[aFirst ? 0 : 1].w = wA;
    while (!S.over && S.turns < turnCap) { const a = chooseAction(); if (!a) break; applyAction(a); }
    if (!S.over) { S.winner = -1; S.endReason = "turn cap"; }
    const reason = S.endReason.replace(/^P\d \S+ (\(\w+ bot\) )?/, "");
    r.reasons[reason] = (r.reasons[reason] || 0) + 1;
    r.turns += S.turns;
    if (S.winner === -1) r.draws++;
    else {
      if (S.winner === 0) r.firstWins++;
      const aWon = (S.winner === 0) === aFirst;
      aWon ? r.winsA++ : r.winsB++;
    }
  }
  r.avgTurns = +(r.turns / games).toFixed(1);
  return r;
}

// ---- Online play: the host's browser runs the game; guests send moves ----
const UI_KEYS = ["mode", "chosen", "objSel", "scoreSel", "info", "flash", "lastCur"];
const ser = o => JSON.stringify(o, (k, v) => v instanceof Set ? {__set: [...v]} : v);
const deser = s => JSON.parse(s, (k, v) => v && v.__set ? new Set(v.__set) : v);
const NET = {
  role: null, seat: null, peer: null, conns: [], code: null, conn: null, seats: [],
  send(msg) { if (this.conn && this.conn.open) this.conn.send(msg); },
  broadcastLobby() { const joined = this.conns.filter(c => c.open && c.seat !== undefined).map(c => c.seat);
    this.conns.forEach(c => c.open && c.send({type: "lobby", seats: this.seats, joined})); },
  broadcastState() { const s = ser(S); this.conns.forEach(c => c.open && c.send({type: "state", s})); },
};
// Connection helpers: STUN finds a direct route between browsers; the TURN
// relay carries the game when a network blocks direct links.
const PEER_OPTS = {config: {iceServers: [
  {urls: "stun:stun.l.google.com:19302"},
  {urls: "stun:global.stun.twilio.com:3478"},
  // Metered relay (app "gridconquest", free plan). Used only when a direct link is blocked.
  {urls: ["turn:global.relay.metered.ca:80", "turn:global.relay.metered.ca:80?transport=tcp", "turn:global.relay.metered.ca:443", "turns:global.relay.metered.ca:443?transport=tcp"],
   username: "2b452655a582b1357c59bd74", credential: "2M+M/yJ96qDowt3x"},
]}};
const peerId = code => "gridconquest-" + code;
const sameAction = (x, y) => x.t === y.t && x.k === y.k && x.cell === y.cell && x.j === y.j &&
  String((x.cells || []).slice().sort((a, b) => a - b)) === String((y.cells || []).slice().sort((a, b) => a - b));

function hostOpen() {
  NET.role = "host";
  NET.code = Math.random().toString(36).slice(2, 8).toUpperCase();
  NET.seats = [{race: "Humans", ctl: "you"}];
  drawLobby("Opening a room…");
  NET.peer = new Peer(peerId(NET.code), PEER_OPTS);
  // A host tab that sleeps (phone app switch) drops off the server; rejoin it.
  NET.peer.on("disconnected", () => setTimeout(() => { if (!NET.peer.destroyed) NET.peer.reconnect(); }, 1000));
  document.addEventListener("visibilitychange", () => { if (!document.hidden && NET.peer.disconnected && !NET.peer.destroyed) NET.peer.reconnect(); });
  NET.peer.on("open", () => drawLobby());
  // Heartbeat: in the lobby, a player silent for 8 s has left (closed the tab).
  setInterval(() => {
    NET.conns.forEach(c => c.open && c.send({type: "ping"}));
    if (!$("game").hidden) return;
    const gone = NET.conns.filter(c => Date.now() - (c.seen || 0) > 8000);
    if (gone.length) { gone.forEach(c => c.close()); NET.conns = NET.conns.filter(c => !gone.includes(c)); assignSeats(); }
  }, 2500);
  NET.peer.on("error", e => drawLobby("Connection problem: " + e.type));
  NET.peer.on("connection", conn => {
    conn.on("open", () => { NET.conns.push(conn); assignSeats(); });
    conn.seen = Date.now();
    conn.on("data", d => { conn.seen = Date.now(); onHostData(conn, d); });
    conn.on("close", () => {
      NET.conns = NET.conns.filter(c => c !== conn);
      if (S && !S.over && $("game") && !$("game").hidden) { S.flash = `P${conn.seat + 1} disconnected. They can rejoin with the same link.`; render(); }
      else assignSeats();
    });
  });
}
function assignSeats() {
  const inGame = S && !S.over && !$("game").hidden;
  if (!inGame) {
    // Lobby: the host plus one seat per friend who has joined (up to 4 players).
    const old = NET.seats, open = NET.conns.filter(c => c.open);
    const bots = old.filter(x => x.ctl === "basic" || x.ctl === "advanced");
    NET.seats = [old[0]];
    open.forEach(c => {
      if (NET.seats.length + bots.length >= 4 && bots.length && !(c.seat !== undefined && old[c.seat] && old[c.seat].ctl === "online")) bots.pop();
      if (NET.seats.length >= 4) { c.send({type: "full"}); setTimeout(() => c.close(), 500); return; }
      const prev = c.seat !== undefined && old[c.seat];
      NET.seats.push({race: prev ? prev.race : Object.keys(RACES)[NET.seats.length % 3], ctl: "online"});
      c.seat = NET.seats.length - 1;
      c.send({type: "welcome", seat: c.seat});
    });
    NET.seats.push(...bots.slice(0, 4 - NET.seats.length));
    return drawLobby();
  }
  // In a game: a returning friend takes back a free online seat.
  const online = NET.seats.map((s, i) => s.ctl === "online" ? i : -1).filter(i => i >= 0);
  const taken = new Set();
  NET.conns.forEach(c => { if (c.seat !== undefined && online.includes(c.seat) && !taken.has(c.seat)) taken.add(c.seat); else c.seat = undefined; });
  NET.conns.forEach(c => {
    if (c.seat === undefined) { const free = online.find(i => !taken.has(i)); if (free !== undefined) { c.seat = free; taken.add(free); } }
    if (c.seat === undefined) { c.send({type: "full"}); setTimeout(() => c.close(), 500); }
    else c.send({type: "welcome", seat: c.seat});
  });

}
function onHostData(conn, d) {
  if (d.type === "pong" || d.type === "bye") { if (d.type === "bye") { conn.seen = 0; conn.close(); } return; }
  if (d.type === "race") {
    const seat = NET.seats[conn.seat];
    if ($("game").hidden && seat && seat.ctl === "online" && RACES[d.race]) { seat.race = d.race; drawLobby(); }
    return;
  }
  if (d.type !== "action" || !S || S.over || S.cur !== conn.seat) return NET.broadcastState();
  if (legalActions().some(x => sameAction(x, d.a))) applyAction(d.a);
  else { conn.send({type: "flash", text: "That move is not legal."}); NET.broadcastState(); }
}
function drawLobby(note) {
  clearTimeout(botTimer); $("menuBtn").hidden = true; $("logBtn").hidden = true; $("logPanel").hidden = true; document.body.classList.remove("playing");
  $("game").hidden = true; $("bar").hidden = true; $("setup").hidden = false;
  const link = location.origin + location.pathname + "?join=" + NET.code;
  const raceOpts = Object.keys(RACES).map(r => `<option>${r}</option>`).join("");
  const ready = NET.peer && NET.peer.open && NET.seats.length >= 2;
  $("setup").innerHTML = `<b style="font-family:var(--display)">Lobby · campaign ${NET.code}</b>
    <p class="muted">${note || "Share this link. Players who open it join this lobby and pick their faction."}</p>
    <div class="row"><input id="lnk" readonly value="${link}" style="flex:1;min-width:0;min-height:44px;font:14px var(--body);padding:6px;border:1px solid var(--line);border-radius:6px;background:var(--parch);color:var(--ink)"><button id="share">Share</button></div>
    ${NET.seats.map((s, i) => `<div class="row"><label style="color:var(--p${i})">P${i+1}</label>
      ${i === 0 ? `<select data-r="0" style="flex:1">${raceOpts}</select><span class="muted" style="flex:0 0 auto">You (host)</span>`
        : s.ctl === "online" ? `<span style="flex:1">${s.race}</span><span class="muted" style="flex:0 0 auto">Joined ✔</span>`
        : `<select data-r="${i}" style="flex:1">${raceOpts}</select><select data-b="${i}"><option value="basic">Basic bot</option><option value="advanced">Advanced bot</option></select><button data-x="${i}" aria-label="Remove bot" style="flex:0 0 auto">✕</button>`}</div>`).join("")}
    <div class="row"><span class="muted" style="flex:1">${NET.seats.length < 4 ? `Waiting for players… (${NET.seats.length}/4)` : "Table full (4/4)."}</span><button id="addBot"${NET.seats.length >= 4 ? " disabled" : ""}>Add bot</button></div>
    <button id="start" class="primary" style="width:100%"${ready ? "" : " disabled"}>Begin the campaign</button>
    <p class="muted">Keep this tab open with the screen on while you play.</p>`;
  $("setup").querySelectorAll("[data-r]").forEach(el => { const i = +el.dataset.r; el.value = NET.seats[i].race; el.onchange = () => { NET.seats[i].race = el.value; NET.broadcastLobby(); }; });
  $("setup").querySelectorAll("[data-b]").forEach(el => { const i = +el.dataset.b; el.value = NET.seats[i].ctl; el.onchange = () => { NET.seats[i].ctl = el.value; NET.broadcastLobby(); }; });
  $("setup").querySelectorAll("[data-x]").forEach(el => el.onclick = () => { NET.seats.splice(+el.dataset.x, 1); drawLobby(); });
  $("addBot").onclick = () => { if (NET.seats.length < 4) { NET.seats.push({race: Object.keys(RACES)[NET.seats.length % 3], ctl: "basic"}); drawLobby(); } };
  $("share").onclick = async () => {
    try { if (navigator.share) await navigator.share({title: "Grid Conquest", url: link}); else { await navigator.clipboard.writeText(link); $("share").textContent = "Copied"; } }
    catch (e) { $("lnk").select(); }
  };
  $("start").onclick = () => {
    newGame(NET.seats.map(s => s.race), NET.seats.map(s => s.ctl === "basic" || s.ctl === "advanced" ? s.ctl : null));
    NET.seats.forEach((s, i) => { if (s.ctl === "online") { S.players[i].remote = true; S.players[i].name += " (online)"; } });
    render();
  };

}

function joinGame(code) {
  NET.role = "guest";
  const wait = t => { document.body.classList.remove("playing"); $("game").hidden = true; $("bar").hidden = true; $("setup").hidden = false; $("setup").innerHTML = `<b style="font-family:var(--display)">Joining campaign ${code}</b><p>${t}</p>`; };
  wait("Connecting…");
  NET.peer = new Peer(PEER_OPTS);
  setTimeout(() => { if (!NET.peer.open && !NET.conn) wait("Can't reach the connection server. Check this device's internet, then reload."); }, 15000);
  NET.peer.on("error", e => wait(e.type === "peer-unavailable" ? "No game found at this link. Ask the host for a new one." : "Connection problem: " + e.type));
  NET.peer.on("open", () => {
    let tries = 0;
    const attempt = () => {
    const conn = NET.peer.connect(peerId(code), {reliable: true});
    NET.conn = conn;
    setTimeout(() => {
      if (conn.open || NET.conn !== conn) return;
      NET.conn = null; conn.close();
      if (++tries < 3) { wait(`Still connecting… (try ${tries + 1} of 3). The host's game tab must stay open and on screen.`); attempt(); }
      else { wait("Couldn't reach the host. Ask them to keep the game tab open and on screen, then tap Retry."); $("setup").insertAdjacentHTML("beforeend", '<button id="retry" class="primary" style="width:100%">Retry</button>'); $("retry").onclick = () => location.reload(); }
    }, 12000);
    conn.on("open", () => wait("Connected. Waiting for the host…"));
    conn.on("close", () => { if (NET.conn !== conn) return; if (S) { S.flash = "Lost the host. Reload this page to rejoin."; S.waiting = true; render(); } else wait("Lost the host. Reload this page to rejoin."); });
    window.addEventListener("pagehide", () => { try { conn.send({type: "bye"}); } catch (e) {} });
    conn.on("data", d => {
      if (d.type === "ping") return conn.send({type: "pong"});
      if (d.type === "welcome") { NET.seat = d.seat; if (!S) wait(`You are P${d.seat + 1}. Waiting for the host to begin…`); }
      else if (d.type === "lobby") guestLobby(code, d.seats, d.joined);
      else if (d.type === "full") wait("This game is full.");
      else if (d.type === "flash") { if (S) { S.flash = d.text; S.waiting = false; render(); } }
      else if (d.type === "state") {
        const ui = {}; if (S) UI_KEYS.forEach(k => ui[k] = S[k]);
        S = deser(d.s); S.sim = false; S.waiting = false;
        UI_KEYS.forEach(k => { if (ui[k] !== undefined) S[k] = ui[k]; });
        if (!Array.isArray(S.scoreSel)) S.scoreSel = [];
        render();
      }
    });
    };
    attempt();
  });
}

// Guest lobby: everyone's seat, with a faction picker on your own.
function guestLobby(code, seats, joined) {
  S = null; document.body.classList.remove("playing"); $("game").hidden = true; $("bar").hidden = true; $("setup").hidden = false;
  const label = s => s.ctl === "you" ? "Host" : s.ctl === "basic" ? "Basic bot" : s.ctl === "advanced" ? "Advanced bot" : "Joined ✔";

    ${seats.map((s, i) => `<div class="row"><label style="color:var(--p${i})">P${i+1}</label>
      ${i === NET.seat ? `<select id="myRace" style="flex:1">${Object.keys(RACES).map(r => `<option${r === s.race ? " selected" : ""}>${r}</option>`).join("")}</select>`

function showSetup() {
  clearTimeout(botTimer); $("menuBtn").hidden = true; $("logBtn").hidden = true; $("logPanel").hidden = true; document.body.classList.remove("playing");
  if (NET.role === "host") return drawLobby();
  $("game").hidden = true; $("bar").hidden = true; $("setup").hidden = false;
  const raceOpts = Object.keys(RACES).map(r => `<option>${r}</option>`).join("");
  $("setup").innerHTML = `<button id="host" class="primary" style="width:100%">Host an online game</button>
    <p class="muted" style="text-align:center">or play on this device</p>
    <div class="row"><label style="flex:1">Players</label><select id="np"><option>2</option><option>3</option><option>4</option></select></div>
    <div id="raceSel"></div>
    <button id="go" style="width:100%;margin-top:8px">Begin the campaign</button>
    <p class="muted">Pass the phone between human players. Tap any tile to read its ability.</p>`;
  const drawRaces = () => {
    const n = +$("np").value, names = Object.keys(RACES);
    $("raceSel").innerHTML = [...Array(n).keys()].map(i => `<div class="row"><label style="color:var(--p${i})">P${i+1}</label><select id="r${i}">${raceOpts}</select><select id="b${i}"><option value="">Human</option><option value="basic"${i ? " selected" : ""}>Basic bot</option><option value="advanced">Advanced bot</option></select></div>`).join("");
    for (let i = 0; i < n; i++) $("r" + i).value = names[i % names.length];
  };
  $("np").onchange = drawRaces; drawRaces();
  $("go").onclick = () => { const ids = [...Array(+$("np").value).keys()]; newGame(ids.map(i => $("r" + i).value), ids.map(i => $("b" + i).value || null)); };
  $("host").onclick = () => { if (typeof Peer === "undefined") { alert("Online play needs an internet connection."); return; } hostOpen(); };
}
const joinCode = new URLSearchParams(location.search).get("join");
if (joinCode && typeof Peer !== "undefined") joinGame(joinCode.toUpperCase()); else showSetup();

// Self-update: if the live page has a newer build than this cached copy, reload it once.
(async () => {
  try {
    if (location.protocol !== "https:") return;
    const mine = (document.querySelector("h1 .muted") || {}).textContent || "";
    const live = await (await fetch(location.pathname + "?check=" + Date.now(), {cache: "no-store"})).text();
    const m = live.match(/build [\w-]+/);
    if (!m || mine.includes(m[0])) return;
    if (sessionStorage.getItem("gcReloaded") === m[0]) return;
    sessionStorage.setItem("gcReloaded", m[0]);
    const q = new URLSearchParams(location.search); q.set("b", m[0].slice(6));
    location.replace(location.pathname + "?" + q);
  } catch (e) {}
})();
